<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керування реллє (Хмарний режим)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 340px; }
        .device-status { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 8px; border-radius: 6px; transition: all 0.3s; }
        .status-online { background-color: #e8f8f5; color: #2ecc71; border: 1px solid #2ecc71; }
        .status-offline { background-color: #fdedec; color: #e74c3c; border: 1px solid #e74c3c; }
        .relay-block { margin-bottom: 25px; padding: 15px; border: 1px solid #eef2f5; border-radius: 8px; background-color: #fafbfc; position: relative; }
        .relay-title { font-weight: bold; margin-bottom: 10px; font-size: 18px; }
        
        .time-input-container { margin-bottom: 15px; font-size: 14px; color: #555; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .time-select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; background: white; cursor: pointer; }

        .indicator { width: 20px; height: 20px; border-radius: 50%; display: inline-block; position: absolute; top: 15px; right: 15px; background-color: #bdc3c7; }
        .indicator.active { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        
        .indicator.loading { 
            background-color: transparent !important;
            box-shadow: none !important;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3498db;
            animation: spin 0.8s linear infinite;
            border-radius: 50%;
            width: 14px;
            height: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn { border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 5px; color: white; transition: background 0.2s; }
        .btn-on { background-color: #2ecc71; }
        .btn-on:hover { background-color: #27ae60; }
        .btn-off { background-color: #e74c3c; }
        .btn-off:hover { background-color: #c0392b; }
        .btn:disabled { background-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .status-text { font-size: 12px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>НРК "ЗМІЙ"</h1>
        <div id="dev-status-block" class="device-status status-offline">Модуль: ОФФЛАЙН</div>
        
        <div class="relay-block" id="block-1">
            <div class="relay-title">Реле 1</div>
            <div class="indicator" id="ind-1"></div>
            <div class="time-input-container">
                <label for="time-1">Время импульса:</label>
                <select id="time-1" class="time-select">
                    <option value="0">0 сек (без времени)</option>
                    <option value="0.5">0.5 сек (*)</option>
                    <option value="1">1 сек</option>
                    <option value="2">2 сек</option>
                    <option value="3">3 сек</option>
                    <option value="5" selected>5 сек</option>
                    <option value="10">10 сек</option>
                </select>
            </div>
            <button class="btn btn-on" id="btn-on-1" onclick="prepareAndSend('11', 'time-1')">ВКЛ</button>
            <button class="btn btn-off" id="id-off-1" onclick="prepareAndSend('21')">ВЫКЛ</button>
        </div>
        
        <div class="relay-block" id="block-2">
            <div class="relay-title">Реле 2</div>
            <div class="indicator" id="ind-2"></div>
            <div class="time-input-container">
                <label for="time-2">Время импульса:</label>
                <select id="time-2" class="time-select">
                    <option value="0">0 сек (без времени)</option>
                    <option value="0.5">0.5 сек (*)</option>
                    <option value="1">1 сек</option>
                    <option value="2">2 сек</option>
                    <option value="3">3 сек</option>
                    <option value="5" selected>5 сек</option>
                    <option value="10">10 сек</option>
                </select>
            </div>
            <button class="btn btn-on" id="btn-on-2" onclick="prepareAndSend('12', 'time-2')">ВКЛ</button>
            <button class="btn btn-off" id="id-off-2" onclick="prepareAndSend('22')">ВЫКЛ</button>
        </div>
        <div class="status-text" id="sync-time">Синхронізація...</div>
    </div>

        <script>
        const UI = {
            status: document.getElementById('dev-status-block'),
            sync: document.getElementById('sync-time'),
            on1: document.getElementById('btn-on-1'),
            off1: document.getElementById('id-off-1'),
            t1: document.getElementById('time-1'),
            ind1: document.getElementById('ind-1'),
            on2: document.getElementById('btn-on-2'),
            off2: document.getElementById('id-off-2'),
            t2: document.getElementById('time-2'),
            ind2: document.getElementById('ind-2')
        };

        let isWaitingForHardware = { "1": false, "2": false };
        let lastTargetState = { "1": null, "2": null };
        let isShortPulse = { "1": false, "2": false };
        let lastClickTime = 0;

        // Строковые константы замаскированы через hex-коды от багов разметки платформы
        const CL_LOADING = "\x6c\x6f\x61\x64\x69\x6e\x67"; // "loading"
        const CL_ACTIVE  = "\x61\x63\x74\x69\x76\x65";   // "active"
        const CL_OFFLINE = "\x73\x74\x61\x74\x75\x73\x2d\x6f\x66\x66\x6c\x69\x6e\x65"; // "status-offline"

        function prepareAndSend(baseCode, selectId = null) {
            let fullCode = baseCode;
            const relay = baseCode.slice(1, 2);
            
            if (selectId) {
                const selectedVal = document.getElementById(selectId).value;
                if (selectedVal === "0.5") {
                    fullCode = baseCode + "*"; 
                    isShortPulse[relay] = true;
                } else if (selectedVal === "0") {
                    fullCode = baseCode; 
                    isShortPulse[relay] = false;
                } else {
                    fullCode = baseCode + ":" + selectedVal; 
                    isShortPulse[relay] = false;
                }
            } else {
                isShortPulse[relay] = false;
            }
            sendCmd(fullCode);
        }

        function sendCmd(code) {
            const action = code.slice(0, 1);
            const relay = code.slice(1, 2);
            
            lastTargetState[relay] = action === '1' ? '1' : '0';
            isWaitingForHardware[relay] = true;
            lastClickTime = Date.now();

            renderButtons();

            fetch('/cmd?code=' + encodeURIComponent(code))
                .then(res => {
                    if (!res.ok) {
                        isWaitingForHardware[relay] = false;
                        lastTargetState[relay] = null;
                        isShortPulse[relay] = false;
                        updateUI();
                    }
                })
                .catch(err => {
                    isWaitingForHardware[relay] = false;
                    lastTargetState[relay] = null;
                    isShortPulse[relay] = false;
                    updateUI();
                });
        }

        function renderButtons(serverData = null) {
            let online = false;
            if (serverData) {
                online = serverData.online;
            } else {
                online = !UI.status.classList.contains(CL_OFFLINE);
            }

            if (online) {
                if (serverData) {
                    UI.status.innerText = "Статус: ОНЛАЙН";
                    UI.status.className = "device-status status-online";
                }

                if (Date.now() - lastClickTime > 5000) {
                    isWaitingForHardware["1"] = false;
                    isWaitingForHardware["2"] = false;
                }

                let realState1 = "0";
                let realState2 = "0";
                if (serverData) {
                    realState1 = serverData["1"] || "0";
                    realState2 = serverData["2"] || "0";
                } else {
                    realState1 = UI.ind1.classList.contains(CL_ACTIVE) ? "1" : "0";
                    realState2 = UI.ind2.classList.contains(CL_ACTIVE) ? "1" : "0";
                }

                if (serverData) {
                    if (isWaitingForHardware["1"] && (isShortPulse["1"] || realState1 === lastTargetState["1"])) {
                        isWaitingForHardware["1"] = false;
                        isShortPulse["1"] = false;
                    }
                    if (isWaitingForHardware["2"] && (isShortPulse["2"] || realState2 === lastTargetState["2"])) {
                        isWaitingForHardware["2"] = false;
                        isShortPulse["2"] = false;
                    }
                }

                const lock1 = isWaitingForHardware["1"] || isWaitingForHardware["2"] || realState1 === "1" || realState2 === "1";
                UI.on1.disabled = lock1;
                UI.off1.disabled = isWaitingForHardware["1"] || realState1 === "0";
                UI.t1.disabled = lock1;

                const lock2 = isWaitingForHardware["2"] || isWaitingForHardware["1"] || realState2 === "1" || realState1 === "1";
                UI.on2.disabled = lock2;
                UI.off2.disabled = isWaitingForHardware["2"] || realState2 === "0";
                UI.t2.disabled = lock2;

                UI.ind1.className = "indicator"; 
                if (isWaitingForHardware["1"]) {
                    UI.ind1.classList.add(CL_LOADING);
                } else if (realState1 === "1") {
                    UI.ind1.classList.add(CL_ACTIVE);
                }

                UI.ind2.className = "indicator"; 
                if (isWaitingForHardware["2"]) {
                    UI.ind2.classList.add(CL_LOADING);
                } else if (realState2 === "1") {
                    UI.ind2.classList.add(CL_ACTIVE);
                }

            } else {
                UI.status.innerText = "Статус: ОФФЛАЙН";
                UI.status.className = "device-status " + CL_OFFLINE;
                UI.on1.disabled = true; UI.off1.disabled = true; UI.t1.disabled = true;
                UI.on2.disabled = true; UI.off2.disabled = true; UI.t2.disabled = true;
                UI.ind1.className = "indicator";
                UI.ind2.className = "indicator";
            }
        }

        function updateUI() {
            fetch('/status-data')
                .then(res => res.json())
                .then(data => {
                    renderButtons(data);
                    UI.sync.innerText = "Зв'язок з сервером: ОК";
                })
                .catch(err => {
                    renderButtons(null);
                    UI.sync.innerText = "Помилка зв'язку з сервером";
                });
        }

        setInterval(updateUI, 500);
        updateUI();
    </script>

</body>
</html>
