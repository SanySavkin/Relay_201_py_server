<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керування реллє (Хмарний режим)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 340px; }
        .device-status { font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 8px; border-radius: 6px; transition: all 0.3s; }
        .status-online { background-color: #e8f8f5; color: #2ecc71; border: 1px solid #2ecc71; }
        .status-offline { background-color: #fdedec; color: #e74c3c; border: 1px solid #e74c3c; }
        .relay-block { margin-bottom: 25px; padding: 15px; border: 1px solid #eef2f5; border-radius: 8px; background-color: #fafbfc; position: relative; }
        .relay-title { font-weight: bold; margin-bottom: 10px; font-size: 18px; }
        
        /* Стили контейнера ввода времени */
        .time-input-container { margin-bottom: 15px; font-size: 14px; color: #555; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .time-input { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }

        .indicator { width: 20px; height: 20px; border-radius: 50%; display: inline-block; position: absolute; top: 15px; right: 15px; background-color: #bdc3c7; }
        .indicator.active { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        
        .indicator.loading { 
            background-color: transparent !important;
            box-shadow: none !important;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3498db;
            animation: spin 0.8s linear infinite;
            border-radius: 50%;
            width: 14px;
            height: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn { border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 5px; color: white; transition: background 0.2s; }
        .btn-on { background-color: #2ecc71; }
        .btn-on:hover { background-color: #27ae60; }
        .btn-off { background-color: #e74c3c; }
        .btn-off:hover { background-color: #c0392b; }
        .btn:disabled { background-color: #e2e8f0; color: #a0aec0; cursor: not-allowed; }
        .status-text { font-size: 12px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>НРК "ЗМІЙ"</h1>
        <div id="dev-status-block" class="device-status status-offline">Модуль: ОФФЛАЙН</div>
        
        <div class="relay-block" id="block-1">
            <div class="relay-title">Реле 1</div>
            <div class="indicator" id="ind-1"></div>
            <div class="time-input-container">
                <label for="time-1">Время:</label>
                <input type="number" id="time-1" class="time-input" value="5" min="1">
                <span>сек</span>
            </div>
            <button class="btn btn-on" id="btn-on-1" onclick="prepareAndSend('11', 'time-1')">ВКЛ</button>
            <button class="btn btn-off" id="id-off-1" onclick="prepareAndSend('21')">ВЫКЛ</button>
        </div>
        
        <div class="relay-block" id="block-2">
            <div class="relay-title">Реле 2</div>
            <div class="indicator" id="ind-2"></div>
            <div class="time-input-container">
                <label for="time-2">Время:</label>
                <input type="number" id="time-2" class="time-input" value="5" min="1">
                <span>сек</span>
            </div>
            <button class="btn btn-on" id="btn-on-2" onclick="prepareAndSend('12', 'time-2')">ВКЛ</button>
            <button class="btn btn-off" id="id-off-2" onclick="prepareAndSend('22')">ВЫКЛ</button>
        </div>
        <div class="status-text" id="sync-time">Синхронізація...</div>
    </div>

    <script>
        let isWaitingForHardware = { "1": false, "2": false };
        let lastTargetState = { "1": null, "2": null };
        let lastClickTime = 0;

        function prepareAndSend(baseCode, inputId = null) {
            let fullCode = baseCode;
            // Если передан ID инпута — значит это команда ВКЛ ('11' или '12'), добавляем к ней время
            if (inputId) {
                let timeVal = parseInt(document.getElementById(inputId).value, 10);
                if (isNaN(timeVal) || timeVal < 1) {
                    timeVal = 1; // Защита на фронтенде: минимум 1 сек
                    document.getElementById(inputId).value = 1;
                }
                fullCode = baseCode + ":" + timeVal;
            }
            sendCmd(fullCode);
        }

        function sendCmd(code) {
            // Парсим чистую команду (берем часть до двоеточия)
            const basePart = code.split(":")[0];
            const action = basePart.charAt(0); // '1' - вкл, '2' - выкл
            const relay = basePart.charAt(1);  // '1' или '2'
            
            lastTargetState[relay] = action === '1' ? '1' : '0';
            isWaitingForHardware[relay] = true;
            lastClickTime = Date.now();

            renderButtons();

            fetch('/cmd?code=' + encodeURIComponent(code))
                .then(res => {
                    if (!res.ok) {
                        console.warn('Команда отклонена сервером');
                        isWaitingForHardware[relay] = false;
                        lastTargetState[relay] = null;
                        updateUI();
                    }
                })
                .catch(err => {
                    console.error('Помилка мережі:', err);
                    isWaitingForHardware[relay] = false;
                    lastTargetState[relay] = null;
                    updateUI();
                });
        }

        function renderButtons(serverData = null) {
            const statusBlock = document.getElementById('dev-status-block');
            const online = serverData ? serverData.online : true;

            if (online) {
                if (serverData) {
                    statusBlock.innerText = "Статус: ОНЛАЙН";
                    statusBlock.className = "device-status status-online";
                }

                if (Date.now() - lastClickTime > 5000) {
                    isWaitingForHardware["1"] = false;
                    isWaitingForHardware["2"] = false;
                }

                const realState1 = serverData ? serverData["1"] : "0";
                const realState2 = serverData ? serverData["2"] : "0";

                if (serverData) {
                    if (isWaitingForHardware["1"] && realState1 === lastTargetState["1"]) isWaitingForHardware["1"] = false;
                    if (isWaitingForHardware["2"] && realState2 === lastTargetState["2"]) isWaitingForHardware["2"] = false;
                }

                const lockButtons1 = isWaitingForHardware["1"] || isWaitingForHardware["2"] || realState1 === "1" || realState2 === "1";
                document.getElementById('btn-on-1').disabled = lockButtons1;
                document.getElementById('id-off-1').disabled = isWaitingForHardware["1"] || realState1 === "0";
                document.getElementById('time-1').disabled = lockButtons1;

                const lockButtons2 = isWaitingForHardware["2"] || isWaitingForHardware["1"] || realState2 === "1" || realState1 === "1";
                document.getElementById('btn-on-2').disabled = lockButtons2;
                document.getElementById('id-off-2').disabled = isWaitingForHardware["2"] || realState2 === "0";
                document.getElementById('time-2').disabled = lockButtons2;

                const ind1 = document.getElementById('ind-1');
                ind1.className = "indicator"; 
                if (isWaitingForHardware["1"]) ind1.classList.add('loading'); else if (realState1 === "1") ind1.classList.add('active');

                const ind2 = document.getElementById('ind-2');
                ind2.className = "indicator"; 
                if (isWaitingForHardware["2"]) ind2.classList.add('loading'); else if (realState2 === "1") ind2.classList.add('active');

            } else {
                statusBlock.innerText = "Статус: ОФФЛАЙН";
                statusBlock.className = "device-status status-offline";
                document.getElementById('btn-on-1').disabled = true;
                document.getElementById('id-off-1').disabled = true;
                document.getElementById('time-1').disabled = true;
                document.getElementById('btn-on-2').disabled = true;
                document.getElementById('id-off-2').disabled = true;
                document.getElementById('time-2').disabled = true;
            }
        }

        function updateUI() {
            fetch('/status-data')
                .then(res => res.json())
                .then(data => {
                    renderButtons(data);
                    document.getElementById('sync-time').innerText = "Зв'язок з сервером: ОК";
                })
                .catch(err => {
                    document.getElementById('sync-time').innerText = "Помилка зв'язку з сервером";
                });
        }

        setInterval(updateUI, 500);
        updateUI();
    </script>
</body>
</html>
